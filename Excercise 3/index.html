<!DOCTYPE html>
<html>
    <head>
        <title>Trash Can</title>
        <link rel="stylesheet" href="styles.css">
        <!-- google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        <!-- add this tag to make the website more responsive -->
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
    </head>
    <body>

    <div class="container">

        <h1>Trash Can</h1>

        <div class="trashcan">
            <picture>
                <source media="(max-width: 1000px)" srcset="garbage.png">
                <img class="trashcan-image" src="garbage1.png" alt="Trash can">
            </picture>
            <img class="fly fly1" src="fly.png" alt="">
            <img class="fly fly2" src="fly.png" alt="">
        </div>

        <p class="happy">freshly emptied :)</p>
        <p class="meh">getting kinda full...</p>
        <p class="gross">TAKE ME OUT!!</p>

        <p class="instructions">resize the browser and hover over the trash can</p>

    </div>

    </body>
</html>
